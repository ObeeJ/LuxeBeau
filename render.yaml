services:
  - type: web
    name: luxebeau-api
    runtime: docker
    dockerfilePath: ./api-go/Dockerfile
    dockerContext: ./api-go
    plan: free
    region: frankfurt
    healthCheckPath: /readyz
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false # Connect Supabase: postgresql://postgres.[REF]:[PASSWORD]@aws-0-[REGION].pooler.supabase.com:6543/postgres?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://myluxebeau.com
      - key: ALLOWED_ORIGINS
        value: https://myluxebeau.com,https://www.myluxebeau.com,https://luxebeau.ajayioba2000.workers.dev,https://luxebeau.pages.dev,http://localhost:3000
      - key: TRUSTED_PLATFORM
        value: cloudflare
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        value: ajayioba2000@gmail.com
      - key: SMTP_PASSWORD
        sync: false # set in the Render dashboard, never in git
      - key: EMAIL_FROM
        value: Akin <ajayioba2000@gmail.com>
      - key: PAYSTACK_SECRET_KEY
        sync: false # set in the Render dashboard, never in git
