name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Go API ────────────────────────────────────────────────────────
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-go

    # A real PostgreSQL for the tests that check database behaviour (unique
    # indexes, simultaneous requests, uuid columns) that SQLite does not reproduce.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d t"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api-go/go.mod
          cache-dependency-path: api-go/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

      # One package at a time (-p 1): these tests share one database and drop
      # their own tables first, so they must not run in parallel.
      - name: Test against PostgreSQL
        run: go test -race -count=1 -p 1 ./internal/order ./internal/review ./internal/social ./internal/messaging
        env:
          TEST_PG_DSN: host=localhost port=5432 user=postgres password=pw dbname=t sslmode=disable

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-w -s" -o /dev/null ./cmd/api

  # ── Next.js web ───────────────────────────────────────────────────
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm jest --passWithNoTests

      - name: Build
        run: pnpm next build
        env:
          NEXT_PUBLIC_API_URL: https://luxebeau-api.onrender.com/api/v1

  # ── Deploy (main only) ────────────────────────────────────────────
  # Render auto-deploys from main via its GitHub integration.
  # This job just confirms the build passed before Render picks it up.
  # No secrets are needed here; Render watches the repo directly.
  deploy-check:
    name: Deploy gate
    needs: [api, web]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: All checks passed
        run: echo "API and web builds passed. Render will deploy from main."
